# kodama-docs settings — generated by `kodama-docs init`.
# Relative paths resolve against this file's directory.
project:
  source_dir: "."
  output_dir: "./doc"
  data_dir: "./data"
  exclude:
    - ".git"
    - ".venv"
    - "node_modules"
    - "build"
    - "dist"
    - "doc"
    - "data"
    - "vendor"
    - "third_party"
  max_file_bytes: 26214400
  copy_meta: true
  # Optional hand-written docs folder (section 0 of the site):
  # manual_doc: "./manual"

llm:
  # "env" reads api_key / base_url from .env (project root first, then this
  # config's directory). Set literal values only if you must.
  base_url: env
  api_key: env
  model: "your-model"
  max_retries: 5
  temperature: 0.1
  max_tokens: 900
  timeout: 300

context:
  include_imports: true
  include_call_targets: true
  include_referenced_variables: true
  max_symbols_per_list: 25
  max_source_lines: 300

documentation:
  generate_function_docs: true
  generate_variable_docs: true
  variable_scope: "file"
  generate_file_summaries: true
  include_anonymous_functions: false
  max_function_lines: 20
  chunk_target_tokens: 20000
  chars_per_token: 4
  max_chunk_lines: 4000
  retry_invalid_json: 2
  skip_existing: true

# parallel LLM agents; no effect with --no-llm
concurrency: 2

tui:
  enabled: true
  interval: 0.5

# Prompt templates copied by `kodama-docs init`. They may use {language},
# {file}, {symbol}, {line}, {params}, {developer_comment}, ...
prompts:
  function: "./prompts/function.txt"
  chunk: "./prompts/function_chunk.txt"
  variable: "./prompts/variable.txt"
  summary: "./prompts/summary.txt"
