[backend]
name = "kodama-python"
description = "Kodama Python backend (tree-sitter)"
source = "https://github.com/lele394/kodama-docs"
version = "0.1.0"
api_version = "1"

[capabilities]
languages = ["python"]
extensions = [".py"]
symbols = true
references = true
call_graph = true
types = false

[requirements]
executables = []
python = ["tree-sitter==0.26.0", "tree-sitter-python==0.25.0"]
