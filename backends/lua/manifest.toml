[backend]
name = "kodama-lua"
description = "Kodama Lua backend (tree-sitter)"
source = "https://github.com/lele394/kodama-docs"
version = "0.1.0"
api_version = "1"

[capabilities]
languages = ["lua"]
extensions = [".lua"]
symbols = true
references = true
call_graph = true
types = false

[requirements]
executables = []
python = ["tree-sitter==0.26.0", "tree-sitter-lua==0.5.0"]
