<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title}</title>
<link id="doc-theme" rel="stylesheet" href="/theme/{theme}/style.css">
<link id="hljs-light" rel="stylesheet"
      href="/lib/github.min.css"{hljs_light}>
<link id="hljs-dark" rel="stylesheet"
      href="/lib/github-dark.min.css"{hljs_dark}>
<script src="/lib/highlight.min.js" defer></script>
<script src="/app.js" defer></script>
<script type="module" src="/sidebar.js"></script>
</head>
<body>
<header class="topbar">
  <span class="topbar-left">
    <button id="sidebar-toggle" type="button"
      title="show/hide the file tree">&#9776; files</button>
    <span class="brand">kodama-docs</span>
  </span>
  <a class="nav" href="/graph">graph</a>
  <button id="theme-toggle" type="button"></button>
</header>
<div class="docs-layout">
<aside class="sidebar" id="sidebar">
  <input id="sb-search" class="sb-search" type="text"
    placeholder="search files, functions, vars…"
    autocomplete="off" spellcheck="false"
    title="fuzzy search — / focuses, Enter opens the first hit, Esc clears">
  <div id="sb-tree" class="sb-tree"></div>
</aside>
<main class="page">
{body}
</main>
</div>
</body>
</html>
