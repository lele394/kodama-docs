<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title}</title>
<link rel="icon" type="image/x-icon" href="/icon/icon.ico">
<link rel="icon" type="image/png" href="/icon/icon.png">
<link id="doc-theme" rel="stylesheet" href="/theme/{theme}/style.css?v=2">
<link id="hljs-light" rel="stylesheet"
      href="/lib/github.min.css"{hljs_light}>
<link id="hljs-dark" rel="stylesheet"
      href="/lib/github-dark.min.css"{hljs_dark}>
<script src="/lib/highlight.min.js" defer></script>
<script src="/app.js" defer></script>
<script type="module" src="/sidebar.js"></script>
</head>
<body class="docs-page">
<header class="topbar">
  <a class="brand" href="/index.md"><img class="brand-icon"
     src="/icon/icon.png" alt="">kodama-docs</a>
  <a class="nav" href="/graph">graph</a>
  <span class="topbar-spacer"></span>
  <button id="theme-toggle" type="button"></button>
</header>
<div class="docs-layout">
<aside class="sidebar" id="sidebar">
  <input id="sb-search" class="sb-search" type="text"
    placeholder="search…  @fn  @var  @file:path"
    autocomplete="off" spellcheck="false"
    title="words AND together; @fn/@var/@file filter by type; @file:src @var:i scopes — / focuses, Enter opens the first hit, Esc clears">
  <div id="sb-tree" class="sb-tree"></div>
  <div class="sb-resizer" title="drag to resize" aria-hidden="true"></div>
</aside>
<main class="page">
{body}
</main>
</div>
</body>
</html>
