# doc_maker settings — all runtime configuration lives here.
# Relative paths are resolved against the directory containing this file.

project:
  source_dir: ".."
  output_dir: "../doc"
  data_dir: "./data"
  source_extensions: [".lua"]
  exclude:
    - "doc_maker"
    - "vendor"
    - "generated"
    - "packed"
    - "bin"
    - "EmptySteamDepot"
    - "win64"
    - ".tmp"
    - "doc"
  max_file_bytes: 26214400
  # copy graph.json + symbols.json into <output_dir>/meta for later reuse
  copy_meta: true

llm:
  base_url: "https://ai.nebuleo.org/api/v1"
  api_key: "env"
  model: "qwen3.8:27b-mtp-q4_K_M"
  max_retries: 5
  temperature: 0.1
  max_tokens: 900
  timeout: 300

context:
  include_imports: true
  include_call_targets: true
  include_referenced_variables: true
  max_symbols_per_list: 25
  max_source_lines: 300

documentation:
  generate_function_docs: true
  generate_variable_docs: true
  variable_scope: "file"
  generate_file_summaries: true
  include_anonymous_functions: false
  # functions longer than this many lines are documented via chunk-and-merge (0 = off)
  max_function_lines: 20
  # target input tokens per chunk call (budget = tokens x chars_per_token)
  chunk_target_tokens: 20000
  # estimated chars per input token (raise to fit bigger chunks, lower for safety)
  chars_per_token: 4
  # hard cap on chunk size in lines (tokens budget usually binds first)
  max_chunk_lines: 4000
  retry_invalid_json: 2
  skip_existing: true
  max_function_tasks: 60
  max_variable_tasks: 30
  max_summary_tasks: 12
  file_priority: "function_count"

# how many parallel LLM agents run the task queue (any positive integer)
concurrency: 2

# terminal UI: live per-agent view while the LLM phase runs
tui:
  enabled: true
  interval: 0.5

prompts:
  function: "./prompts/function.txt"
  chunk: "./prompts/function_chunk.txt"
  variable: "./prompts/variable.txt"
  summary: "./prompts/summary.txt"
